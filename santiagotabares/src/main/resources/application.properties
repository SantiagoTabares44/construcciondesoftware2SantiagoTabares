# ── App ──────────────────────────────────────────────────────────
spring.application.name=santiagotabares
server.port=8080

# ── MySQL (XAMPP) ────────────────────────────────────────────────
# Asegúrate de iniciar MySQL desde el panel de control de XAMPP.
# Credenciales por defecto de XAMPP: usuario root, sin contraseña.
spring.datasource.url=jdbc:mysql://localhost:3306/banco_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ── JPA / Hibernate ──────────────────────────────────────────────
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# ── Actuator health check ─────────────────────────────────────────
management.endpoints.web.exposure.include=health
