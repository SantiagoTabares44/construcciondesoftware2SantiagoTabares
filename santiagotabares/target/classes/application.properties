# ── Conexión MySQL ──────────────────────────────────────────────
# Cambia 'tu_password' por tu contraseña real de MySQL
spring.datasource.url=jdbc:mysql://localhost:3306/banco_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=tu_password
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ── JPA / Hibernate ─────────────────────────────────────────────
# 'update' = Hibernate crea/actualiza tablas automáticamente al arrancar
# En producción esto debe ser 'validate' o 'none'
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# ── Spring Boot ──────────────────────────────────────────────────
spring.application.name=santiagotabares

# ── Seguridad: deshabilitada temporalmente ───────────────────────
# Esto evita que Spring Security bloquee los endpoints mientras
# construyes la API. Se habilita de nuevo en el Paso 3 (controllers)
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.security.servlet.SecurityAutoConfiguration
